######################################################################
# Metro Card Accelerator - regression configuration
# Format is kept compatible with the ICTC UART regression template.
######################################################################
cmp_opts =
cov = off
wave = on
pass_key_word = "TEST PASSED"
fail_key_word = "TEST FAILED"
pl = UVM_LOW

tc_list {
  // Reset and APB register behavior
  metro_reset_test, run_times=1, run_opts= ;
  metro_register_test, run_times=1, run_opts= ;

  // Bloom Filter insert/query behavior
  metro_hash_program_test, run_times=1, run_opts= ;
  metro_smoke_test, run_times=1, run_opts= ;

  // Exact-match fallback scenarios
  metro_fallback_miss_test, run_times=1, run_opts= ;
  metro_fallback_table_test, run_times=1, run_opts= ;
}
